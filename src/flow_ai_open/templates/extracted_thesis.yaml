    - 西文字体：Times New Roman
    - 字号：三号 (16.0 磅)
    - 对齐：居中
    - 首行缩进：1.12 字符 (18.0 磅)
    - 段后：31.2 磅
    - 行距：固定值 23.0 磅
    - 大纲级别：1 级
