profiles:
  toc_visual:
    has_dot_leader: true
    page_number_alignment: right
    entry_styles:
      '1': TOC 1
      '2': TOC 2
      '3': TOC 3
  front_matter:
    abstract_body:
      semantic_role: abstract_body
      prefix_label: 摘要
      label_font_bold: true
      label_font_name: 黑体
      label_font_size_pt: 14.0
      content_style: FlowAbstractBody
      no_first_line_indent: true
    keywords:
      semantic_role: keywords
      prefix_label: 关键词：
      label_font_bold: true
      label_font_name: 黑体
      label_font_size_pt: 16.0
      content_style: FlowKeywords
      no_first_line_indent: true
    abstract_body_en:
      semantic_role: abstract_body_en
      prefix_label: ABSTRACT
      label_font_bold: true
      label_font_name: Times New Roman
      label_font_size_pt: 14.0
      content_style: FlowAbstractBodyEN
      no_first_line_indent: true
    keywords_en:
      semantic_role: keywords_en
      prefix_label: KEY WORDS
      label_font_bold: true
      label_font_name: Times New Roman
      label_font_size_pt: 16.0
      content_style: FlowKeywordsEN
      no_first_line_indent: true
  reference:
    entry_style: FlowReferencesItem
    right_indent_pt: 24.0
    line_spacing_pt: 23.0
  acknowledgment:
    body_style: FlowAcknowledgmentBody
    first_line_indent_pt: 24.0
    right_indent_pt: 24.0
    line_spacing_pt: 23.0
  page_break_decisions: {}
